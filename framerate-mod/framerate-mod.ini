[Simulation]
; Gameplay/physics tick rate in Hz. Speedrunners should keep this at 62. Range 10-1000.
TickRate=62

[Loading]
; Level streaming speed. Keep at 62 for 62Hz-like loads at any FPS.
; 0 = loads scale with FPS, how it does without the mod (faster above 62, slower below).
; Note the "Loading..." video scenes are never slowed either way.
; Range 10-1000, or 0.
PaceRate=62

[Smoothing]
; Smooths motion between ticks for these types of actors. You should leave these on.
; Camera is always smoothed regardless.
FirstPerson=1
WorldMeshes=1
Movers=1
MoverLead=1
Lights=1

; Optional: only smooth world meshes within this many meters of the
; camera. 0 = unlimited. Should be fine to leave at 0, but if you have a very low-end system
; you can try increasing this number if you don't mind distant world meshes not being smoothed.
WorldMeshRange=0

[Framerate]
; FPS cap.
; -1 = use the game's own settings (Mirror's Edge Tweaks FPS setting / TdEngine.ini)
; 0 = uncapped
; N = cap at N FPS, leaving the cap responsibility to the mod
Cap=-1

; Even frame pacing.
; In heavy CPU-bound scenes (e.g. missing the PhysX lag fix) a simulation frame can cost
; more than the frame budget while the in-between frames stay cheap, which
; presents itself as a hitching rhythm tied to TickRate (even at high FPS).
; With this on, the mod spaces frames evenly so motion feels steady at a slightly lower framerate instead.
; This only runs when that hitch is actually happening, otherwise it stays inactive and won't burn your FPS just to even things out.
; If this is causing you issues, set it to 0 (highest FPS but hitch stays in heavy scenes)
EvenPacing=1

[Input]
; Mouse to tick alignment.
; Fixes small regular look stutter as well as jitter when you're moving your mouse during look-constrained moves
; (e.g. wallclimb sidesteps) when the framerate is not an exact multiple of TickRate. Generally fine to leave on.
MouseResample=1

; Late latched mouse look.
; Enabled it shows the mouse motion that has arrived so far, on top of the newest tick's rotation. Should keep it enabled.
; Without it the camera shows rotation one simulation interval in the past with the rest of the world.
LateLatchMouse=1

; Same as above but for look-constrained movestates.
LateLatchMoves=1

[Diagnostics]
Logging=0
